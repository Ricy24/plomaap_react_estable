name = "plomaap-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Limites por IP y por ubicacion de Cloudflare (el periodo solo admite 10 o 60 s).
# El binding de rate limiting esta incluido en el plan Free.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 40
  period = 60

[[ratelimits]]
name = "RL_READ"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 240
  period = 60

[observability]
enabled = true
